name: Desktop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed apps packages
      - run: dart analyze .
      - run: flutter test
        working-directory: apps/desktop
      - run: flutter test
        working-directory: packages/kenai_core
      - run: flutter test
        working-directory: packages/kenai_ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
